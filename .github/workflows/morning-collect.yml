
name: Morning Event Collection

on:
  schedule:
    # 毎朝8時（日本時間）に実行
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: 実行時刻を確認
        run: |
          echo "たこ神 出店ナビの自動収集を開始します"
          date -u
          echo "日本時間の朝8時に実行する設定です"
